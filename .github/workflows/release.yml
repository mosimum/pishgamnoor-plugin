name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          mkdir -p build
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' ./ build/Pishgamnoor-plugin/
          cd build
          zip -r ../Pishgamnoor-plugin.zip Pishgamnoor-plugin

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Pishgamnoor-plugin.zip
          generate_release_notes: true
          body: |
            ## Pishgamnoor Studio ${{ github.ref_name }}

            استودیو نور سه‌بعدی پیشگام نور — نسخه ${{ github.ref_name }}

            - استودیو سه‌بعدی ۱۰ محصول
            - مدیریت محصولات از پیشخوان
            - تنظیمات ظاهری و تایپوگرافی
            - شورت‌کد `[pishgamnoor_studio]`
            - توسعه‌دهنده: Mostafa Moosavi
