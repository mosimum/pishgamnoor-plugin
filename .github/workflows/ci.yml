name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: PHP lint
        run: |
          find . -name "*.php" -not -path "./build/*" -print0 | xargs -0 -n1 php -l

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS syntax
        run: |
          node --check assets/js/studio.js
          node --check assets/js/admin.js
